{% extends "base.html" %}

{% block title %}Добавить товар{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="fas fa-plus-circle"></i> Добавление товара</h4>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('add_item') }}">
                    <div class="row g-2 g-sm-3">
                        <div class="col-12">
                            <label for="name" class="form-label">Название товара <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required>
                        </div>
                        
                        <div class="col-12 col-sm-6">
                            <label for="category" class="form-label">Категория <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">Выберите...</option>
                                <option value="Техника">Техника</option>
                                <option value="Мебель">Мебель</option>
                                <option value="Расходники">Расходники</option>
                                <option value="Канцелярия">Канцелярия</option>
                                <option value="Другое">Другое</option>
                            </select>
                        </div>
                        
                        <div class="col-6 col-sm-3">
                            <label for="quantity" class="form-label">Кол-во <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="quantity" name="quantity" 
                                   min="0" step="1" required>
                        </div>
                        
                        <div class="col-6 col-sm-3">
                            <label for="location" class="form-label">Место <span class="text-danger">*</span></label>
                            <select class="form-select" id="location" name="location" required>
                                <option value="">Выберите...</option>
                                <option value="Склад А">Склад А</option>
                                <option value="Склад Б">Склад Б</option>
                                <option value="Офис 101">Офис 101</option>
                                <option value="Офис 202">Офис 202</option>
                                <option value="Серверная">Серверная</option>
                            </select>
                        </div>
                        
                        <div class="col-12">
                            <label for="description" class="form-label">Описание</label>
                            <textarea class="form-control" id="description" name="description" rows="3" 
                                      placeholder="Дополнительная информация..."></textarea>
                        </div>
                        
                        <div class="col-12">
                            <hr>
                            <div class="d-flex flex-wrap gap-2">
                                <button type="submit" class="btn btn-success flex-grow-1 flex-sm-grow-0">
                                    <i class="fas fa-save"></i> Сохранить
                                </button>
                                <a href="{{ url_for('index') }}" class="btn btn-secondary flex-grow-1 flex-sm-grow-0">
                                    <i class="fas fa-times"></i> Отмена
                                </a>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
