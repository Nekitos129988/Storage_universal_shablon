<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>{% block title %}Инвентарь офиса{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 (иконки) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ОБЩИЕ СТИЛИ */
        body {
            background-color: #f8f9fa;
            padding-bottom: 20px;
        }
        
        .navbar {
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        
        .card {
            box-shadow: 0 2px 4px rgba(0,0,0,.05);
            border: none;
        }
        
        /* Стили для заголовков таблицы */
        .table th {
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }
        .table th:hover {
            background-color: #e9ecef;
        }
        .sort-arrow {
            margin-left: 5px;
            font-size: 0.8em;
        }
        
        /* Карточки статистики */
        .stats-card {
            border-left: 4px solid #0d6efd;
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 15px;
            height: 100%;
        }
        .stats-card h6 {
            font-size: 0.85rem;
        }
        .stats-card h3 {
            font-size: 1.5rem;
            margin-bottom: 0;
        }
        
        /* Flash-сообщения */
        .flash-messages {
            position: fixed;
            top: 80px;
            right: 20px;
            z-index: 9999;
            max-width: 400px;
            width: calc(100% - 40px);
        }
        .flash-messages .alert {
            margin-bottom: 10px;
        }
        
        /* Кнопки действий */
        .btn-action {
            margin: 0 2px;
        }
        
        .pagination {
            margin-bottom: 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .pagination .page-link {
            padding: 0.375rem 0.75rem;
            font-size: 0.9rem;
        }
        
        /* Блок фильтров */
        .filter-section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        /* Мобильная адаптация таблицы */
        .table-responsive {
            border-radius: 8px;
        }
        
        /* Убираем лишние отступы на телефоне */
        @media (max-width: 576px) {
            .container {
                padding-left: 10px;
                padding-right: 10px;
            }
            .navbar-brand {
                font-size: 1rem;
            }
            .stats-card h3 {
                font-size: 1.2rem;
            }
            .flash-messages {
                top: 70px;
                right: 10px;
                max-width: calc(100% - 20px);
            }
            .filter-section .row > div {
                margin-bottom: 10px;
            }
            .filter-section .btn {
                width: 100% !important;
            }
            .table th, .table td {
                font-size: 0.85rem;
                padding: 0.4rem 0.3rem;
            }
            .table th .sort-arrow {
                display: none;
            }
            .btn-action {
                padding: 0.2rem 0.4rem;
                font-size: 0.8rem;
            }
            .badge {
                font-size: 0.7rem;
            }
            .pagination .page-link {
                padding: 0.25rem 0.5rem;
                font-size: 0.8rem;
            }
            .pagination .page-item {
                margin-bottom: 3px;
            }
        }
        
        /* Для средних экранов (планшеты) */
        @media (max-width: 768px) {
            .stats-card h3 {
                font-size: 1.3rem;
            }
            .table th, .table td {
                font-size: 0.9rem;
                padding: 0.5rem 0.4rem;
            }
        }
        
        /* Для очень маленьких экранов */
        @media (max-width: 400px) {
            .table th, .table td {
                font-size: 0.75rem;
                padding: 0.3rem 0.2rem;
            }
            .btn-action {
                padding: 0.15rem 0.3rem;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">
                <i class="fas fa-boxes"></i>
                <span class="d-none d-sm-inline">Инвентарь офиса</span>
                <span class="d-inline d-sm-none">Инвентарь</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">
                            <i class="fas fa-list"></i>
                            <span class="d-none d-sm-inline">Все товары</span>
                            <span class="d-inline d-sm-none">Список</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('add_item') }}">
                            <i class="fas fa-plus-circle"></i>
                            <span class="d-none d-sm-inline">Добавить товар</span>
                            <span class="d-inline d-sm-none">Добавить</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Flash-сообщения -->
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <!-- Основной контент -->
    <div class="container mt-3 mt-sm-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Подтверждение удаления -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const deleteForms = document.querySelectorAll('.delete-form');
            deleteForms.forEach(form => {
                form.addEventListener('submit', function(e) {
                    if (!confirm('Вы уверены, что хотите удалить этот товар?')) {
                        e.preventDefault();
                    }
                });
            });
        });
    </script>
</body>
</html>
